<?xml version="1.0" encoding="UTF-8"?>
<!--
  Topbar brand mark v5 — same radar scope as the favicon, no card
  background. The topbar parent (.app-topbar-brand-mark) already
  provides the rounded amber-bordered card; this file only needs
  the scope contents.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ktn-mark-sweep" x1="12.95" y1="21" x2="43" y2="12.95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ffb84d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="#ffb84d" stroke-opacity="0.35" stroke-width="0.9">
    <circle cx="32" cy="32" r="8"/>
    <circle cx="32" cy="32" r="15"/>
  </g>

  <g stroke="#ffb84d" stroke-opacity="0.4" stroke-width="0.9" stroke-linecap="round">
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="54" y2="32"/>
  </g>

  <path d="M 32 32 L 12.95 21 A 22 22 0 0 1 43 12.95 Z" fill="url(#ktn-mark-sweep)"/>

  <line x1="32" y1="32" x2="43" y2="12.95"
        stroke="#ffd07a" stroke-width="1.8" stroke-linecap="round"/>

  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffd07a" stroke-width="2.2"/>

  <g fill="#ffd07a">
    <circle cx="43.4" cy="38.6" r="1.5"/>
    <circle cx="29.0" cy="40.3" r="1.2"/>
    <circle cx="14.4" cy="38.4" r="1.0" opacity="0.65"/>
  </g>

  <circle cx="32" cy="32" r="1.5" fill="#ffd07a"/>
</svg>
