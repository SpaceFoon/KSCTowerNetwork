<?xml version="1.0" encoding="UTF-8"?>
<!--
  KSC Tower Network favicon — v5 (start-over).
  Concept: ATC radar scope, not a tower silhouette. Amber-on-dark
  intentionally evokes the phosphor-CRT look of a real air-traffic
  scope. No more hand-drawn tower geometry.

  Layered (back to front):
    1. Rounded card background (dark amber gradient, amber border)
    2. Two concentric range rings, low opacity
    3. Crosshairs spanning the diameter, low opacity
    4. Sweep wedge — 90° pie slice with a linear gradient fading from
       transparent (trailing edge) to amber (leading edge), giving the
       classic phosphor-decay trail behind the rotating arm
    5. Bright sweep arm at the leading edge of the wedge
    6. Outer scope ring on top (so it cleanly outlines the wedge edge)
    7. Three aircraft blip dots scattered in the scope, with the
       outermost one dimmer to suggest range falloff
    8. Center dot (radar origin)

  Geometry:
    cx=32, cy=32, scope radius=22.
    Sweep is a 90° wedge from bearing 300° (trailing) through 0° (up)
    to bearing 30° (leading), so the arm points to the 1 o'clock
    position and the trail fades back through 12 toward 10 o'clock.
    Coordinates pre-computed and pinned to the gradient endpoints.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KSC Tower Network">
  <defs>
    <linearGradient id="ktn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1c0d"/>
      <stop offset="100%" stop-color="#3d2a14"/>
    </linearGradient>
    <!--
      Sweep wedge gradient: anchored in user-space so the fade is
      perpendicular to the bisector of the wedge (i.e. fades along the
      sweep direction, not along the SVG axes). Endpoints are the
      trailing-edge tip (12.95, 21) and the leading-edge tip (43, 12.95).
    -->
    <linearGradient id="ktn-sweep" x1="12.95" y1="21" x2="43" y2="12.95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ffb84d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="64" height="64" rx="12" fill="url(#ktn-bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="11.5" fill="none"
        stroke="#ffb84d" stroke-opacity="0.55"/>

  <!-- Range rings (concentric, faint) -->
  <g fill="none" stroke="#ffb84d" stroke-opacity="0.3" stroke-width="0.8">
    <circle cx="32" cy="32" r="8"/>
    <circle cx="32" cy="32" r="15"/>
  </g>

  <!-- Crosshairs (full diameter, faint) -->
  <g stroke="#ffb84d" stroke-opacity="0.35" stroke-width="0.8" stroke-linecap="round">
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="54" y2="32"/>
  </g>

  <!-- Sweep wedge: 300° → 0° → 30° (90° arc through the top) -->
  <path d="M 32 32 L 12.95 21 A 22 22 0 0 1 43 12.95 Z" fill="url(#ktn-sweep)"/>

  <!-- Sweep arm at the leading edge -->
  <line x1="32" y1="32" x2="43" y2="12.95"
        stroke="#ffd07a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Outer scope ring (drawn last so it overlays the wedge cleanly) -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffd07a" stroke-width="2"/>

  <!-- Aircraft blip dots; outer one dimmer to imply range falloff -->
  <g fill="#ffd07a">
    <circle cx="43.4" cy="38.6" r="1.5"/>
    <circle cx="29.0" cy="40.3" r="1.2"/>
    <circle cx="14.4" cy="38.4" r="1.0" opacity="0.6"/>
  </g>

  <!-- Center dot (radar origin) -->
  <circle cx="32" cy="32" r="1.5" fill="#ffd07a"/>
</svg>
