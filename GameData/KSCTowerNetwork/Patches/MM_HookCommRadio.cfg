// Attach KSCTowerNetwork's PTT poller, frequency-sync, and tower RX mirror InternalModules to
// the ASET COMM radio prop (RasterPropMonitor variant) and the MOARdV MAS variant. PTT + freq
// read the same per-pod persistents ASET / MAS already write; RX mirror writes KSCTOWER_COMM_RX
// / KSCTOWER_COMM_RX_LEVEL from live helmet audio (see MM_AsetCommRadioTowerRxAnnunciator.cfg).
//
// :FINAL ordering ensures we slot in after the ASET prop's own MODULE list is fully built
// (Reviva and other prop-rewriters run earlier), so our modules sit at the end.

@PROP[ASET_COMM_Radio]:NEEDS[ASET]:FINAL
{
	MODULE
	{
		name = KSCTowerCommRadioPtt
	}
	MODULE
	{
		name = TowerCommRadioFreqSync
	}
	MODULE
	{
		name = TowerCommRadioRxSync
	}
}

@PROP[MAS_ASET_COMM_Radio]:NEEDS[MOARdV/AvionicsSystems]:FINAL
{
	MODULE
	{
		name = KSCTowerCommRadioPtt
	}
	MODULE
	{
		name = TowerCommRadioFreqSync
	}
	MODULE
	{
		name = TowerCommRadioRxSync
	}
}
