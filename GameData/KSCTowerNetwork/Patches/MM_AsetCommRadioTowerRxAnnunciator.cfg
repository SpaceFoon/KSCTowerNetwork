// In-cockpit "◄ LIVE" annunciator when real tower downlink is present (TowerCommRadioRxSync
// drives KSCTOWER_COMM_RX from TowerVoicePlayback). MAS ASET COMM radio only — RPM cockpit
// props still receive the same persistents if you add a matching JSI label in a personal patch.

@PROP[MAS_ASET_COMM_Radio]:NEEDS[MOARdV/AvionicsSystems]:FINAL
{
	@MODULE[MASComponent]
	{
		+TEXT_LABEL
		{
			name = KSCTower Live RX annunciator
			transform = NAV_RADIO_MODEL_TextObj
			fontSize = 1.25
			lineSpacing = 0.85
			font = Liberation Sans
			style = Bold
			alignment = Right
			anchor = UpperRight
			emissive = active
			blend = true
			variable = fc.Conditioned(fc.GetPersistentAsNumber("ASET_COMM_RADIO_TURN_ON"))
			activeColor = 0.15,1.0,0.28,1
			passiveColor = 0,0,0,0
			text = <=0:"";"◄ LIVE"=> fc.GetPersistentAsNumber("KSCTOWER_COMM_RX")
		}
	}
}
