// Push-to-talk IVA prop for KSCTowerNetwork voice-bridge (MIC_ON / MIC_OFF while held).
// Requires RasterPropMonitor + ASET push-button models + KSCTowerNetwork.Client.dll.
//
// To place in a cockpit: copy a nearby PROP block (position/rotation/scale) from your INTERNAL
// (e.g. next to pb_CHATTERER_PTT-F03-G1) and set name = pb_KSCTOWER_mic_PTT

PROP
{
	name = pb_KSCTOWER_mic_PTT

	MODEL
	{
		model = ASET/ASET_Props/Control/Push_Button_Modular/models/pb_Full_Cap_White
		texture = pb_Full_Cap_Black,ASET/ASET_Props/Control/Push_Button_Modular/models/pb_Full_Cap_Black
	}

	MODEL
	{
		model = ASET/ASET_Props/Control/Push_Button_Modular/models/pb_Collider
	}

	MODULE
	{
		name = JSIActionGroupSwitch
		animationName = pb_PushAnim
		switchTransform = pb_Collider
		customSpeed = 1.5
		actionName = plugin
		momentarySwitch = true
		switchSound = ASET/ASET_Props/Sounds/pb_Push02
		switchSoundVolume = 2.0
		PLUGINACTION
		{
			name = KSCTowerRpmMic
			actionMethod = TowerMicSet
		}
	}

	MODULE
	{
		name = JSILabel
		transformName = Legend_Center
		alignment = Center
		anchor = MiddleCenter
		fontName = Liberation Sans
		fontSize = 6.5
		zeroColor = 20,20,20,255
		labelText = TWR
		oneshot = true
	}
}
