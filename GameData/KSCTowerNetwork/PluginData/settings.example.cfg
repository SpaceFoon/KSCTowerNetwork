// KSCTowerNetwork example settings.
//
// Copy this file to settings.cfg in the same folder and edit it for your install.
// The plugin only reads settings.cfg; settings.example.cfg is shipped untouched
// so you always have a working template to fall back to.
//
// IMPORTANT: KSP's ConfigNode parser treats // inside a value as the start of an
// end-of-line comment, so writing
//     towerApiBaseUrl = http://my-host/v1
// would be parsed as just "http:". Use the split host/port/path keys below.
KSCTOWERNETWORK
{
	// --- Tower backend ---------------------------------------------------------
	// Where the KSP plugin and the voice-bridge talk to the backend API.
	// For a self-hosted single-machine setup this is 127.0.0.1.
	// For a community-hosted backend, set towerApiHost to the public hostname,
	// towerApiPort to 443, and towerApiTls to True.
	towerApiHost = 127.0.0.1
	towerApiPort = 48787
	towerApiPath = /v1
	towerApiTls = False

	// --- Live UDP path (telemetry/status/ghost queries) -----------------------
	// Keep enabled to bypass high-frequency HTTP polling/POST load on the backend.
	// Falls back to HTTP when liveUdpFallbackHttp=True and UDP is unavailable.
	useUdpLiveTransport = True
	liveUdpHost = 127.0.0.1
	liveUdpPort = 48788
	liveUdpTimeoutMs = 500
	liveUdpFallbackHttp = True

	// --- Session / call channel -----------------------------------------------
	sessionId = dev-shared

	// --- Local voice plumbing (bridge <-> KSP over loopback TCP) ---------------
	// Do not change unless another app already owns these ports.
	voiceListenHost = 127.0.0.1
	voiceListenPort = 47372
	voiceCtlHost = 127.0.0.1
	voiceCtlPort = 47373

	// --- UX --------------------------------------------------------------------
	pushToTalkKey = R
	skipTowerLogin = False
	rememberTowerEmail = True
	persistTowerSessionToken = True
	autoConnectDelaySeconds = 3
	autoConnectVoiceListen = True
	autoBridgeMicAfterListen = False
	// Mutes Chatterer + ASET fake ATC clips for the whole flight (recommended for real tower voice).
	// False = only mute while PTT is held (see TowerChattererDuck).
	blockChattererInFlight = True

	// --- Voice bridge auto-launch ---------------------------------------------
	// Spawns PluginData/bridge-runtime/start-bridge.cmd at game start. The
	// shipped runtime bundles its own node.exe so end users do not need to
	// install Node. The watchdog inside the bridge exits when KSP_x64.exe
	// disappears, so quitting KSP also tears the bridge down.
	autoStartVoiceBridge = True
	bridgeExecutable = GameData/KSCTowerNetwork/PluginData/bridge-runtime/start-bridge.cmd
	bridgeWorkingDirectory = GameData/KSCTowerNetwork/PluginData/bridge-runtime
	bridgeArguments =
	bridgeEnv_BRIDGE_IDENTITY = ksp_bridge

	// --- kOS ACARS bridge ------------------------------------------------------
	// Lets a KerboScript program read tower ACARS and queue outgoing messages by
	// reading/writing files in your kOS Archive volume. Disable to fully suppress
	// any reads/writes under the kOS folder.
	//
	// On first run with kosBridgeAutoInstallScript=True the plugin drops two
	// scripts into the Archive: acars.ks (interactive monitor) and
	// acars_lib.ks (helper functions). Run them from any kOS terminal,
	// including the IVA terminal popup, with:    RUN ACARS.
	kosBridgeEnabled = True
	kosBridgeArchivePath = Ships/Script
	kosBridgeAutoInstallScript = True
	kosBridgePollSeconds = 3
}
